<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8"/>
      <stop offset="100%" style="stop-color:#0d47a1"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)"/>
  <!-- Robot head -->
  <rect x="36" y="22" width="56" height="42" rx="10" fill="#fff"/>
  <!-- Eyes -->
  <circle cx="48" cy="40" r="7" fill="#1a73e8"/>
  <circle cx="80" cy="40" r="7" fill="#1a73e8"/>
  <circle cx="50" cy="38" r="2.5" fill="#fff"/>
  <circle cx="82" cy="38" r="2.5" fill="#fff"/>
  <!-- Antenna -->
  <line x1="64" y1="22" x2="64" y2="12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="10" r="4" fill="#2ecc71"/>
  <!-- Mouth -->
  <rect x="46" y="52" width="36" height="5" rx="2.5" fill="#1a73e8"/>
  <!-- Body -->
  <rect x="40" y="68" width="48" height="30" rx="6" fill="#fff"/>
  <!-- VR text on body -->
  <text x="64" y="89" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="18" fill="#1a73e8">VR</text>
  <!-- Arms -->
  <rect x="22" y="72" width="14" height="22" rx="5" fill="#fff"/>
  <rect x="92" y="72" width="14" height="22" rx="5" fill="#fff"/>
  <!-- Wheels -->
  <circle cx="48" cy="104" r="6" fill="#fff"/>
  <circle cx="80" cy="104" r="6" fill="#fff"/>
  <circle cx="48" cy="104" r="3" fill="#1a73e8"/>
  <circle cx="80" cy="104" r="3" fill="#1a73e8"/>
</svg>
